apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.127.0.0.1.nip.io
      http:
        paths:
          - path: /api/v1/wiki-export
            pathType: Prefix
            backend:
              service:
                name: backend2
                port:
                  number: 8010
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
